<script>
(function () {
  var b = document.getElementById("themeToggle"), root = document.documentElement;
  function dark() { var t = root.getAttribute("data-theme"); return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
  function paint() { b.innerHTML = Archer.icon(dark() ? "sun" : "moon"); }
  b.addEventListener("click", function () { root.setAttribute("data-theme", dark() ? "light" : "dark"); paint(); });
  paint();
})();
</script>
