<section id="linked-source" class="joints rule-b px">
  <div class="ls-box">
    <div class="ls-head">
      <span class="ls-file mono">architecture.arch</span>
      <span class="chip ls-hint" aria-live="polite"></span>
      <button type="button" class="btn btn-ghost btn-sm ls-reset" disabled><span class="ls-i" data-icon="arrow-counter-clockwise"></span>Reset</button>
      <a class="btn btn-ghost btn-sm" href="#top">See more<span class="ls-i" data-icon="arrow-right"></span></a>
    </div>
    <div class="ls-body">
      <div class="ls-canvas ground" aria-label="Canvas">
        <div class="ls-stage"></div>
      </div>
      <div class="ls-source">
        <pre class="ls-pre" tabindex="0" aria-label="Document source. Arrow keys move between lines."></pre>
      </div>
    </div>
  </div>
</section>

<style>
#linked-source { padding-top: 48px; padding-bottom: 48px; }
@media (min-width: 640px) { #linked-source { padding-top: 64px; padding-bottom: 64px; } }
#linked-source .ls-box { overflow: hidden; border: 1px solid var(--line-2); background: var(--surface); box-shadow: var(--shadow-md); }
#linked-source .ls-head { display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--line); }
#linked-source .ls-file { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--t-sm); color: var(--ink-2); }
#linked-source .ls-hint { margin-left: 8px; margin-right: auto; }
#linked-source .ls-hint .icon { width: 12px; height: 12px; }
#linked-source .ls-i { display: inline-flex; }
@media (max-width: 479px) { #linked-source .ls-hint { display: none; } #linked-source .ls-head .ls-reset { margin-left: auto; } }

#linked-source .ls-body { display: grid; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1024px) { #linked-source .ls-body { grid-template-columns: minmax(0, 1fr) 340px; } }

/* Canvas. Connectors read as ink on the landing canvas, as in landing.css. */
#linked-source .ls-canvas { --edge: var(--ink); --edge-strong: #000; position: relative; height: 440px; overflow: hidden; touch-action: manipulation; }
:root[data-theme="dark"] #linked-source .ls-canvas { --edge-strong: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #linked-source .ls-canvas { --edge-strong: #fff; } }
@media (min-width: 640px) { #linked-source .ls-canvas { height: 528px; } }
#linked-source .ls-stage { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; }
#linked-source .ls-stage > * { position: absolute; }
#linked-source .ls-stage > *, #linked-source .ls-edge { transition: opacity 120ms ease; }
#linked-source .is-dim { opacity: 0.6; }

#linked-source .plane { cursor: default; transition: border-color 120ms ease, opacity 120ms ease; }
#linked-source .plane-head { height: 32px; gap: 10px; padding: 0 12px; font-size: var(--t-base); cursor: pointer; border-radius: var(--r-lg) var(--r-lg) 0 0; }
#linked-source .plane-head svg { color: var(--ink-3); }
#linked-source .plane.is-hl, #linked-source .plane.is-sel { border-color: var(--accent); }
#linked-source .plane-head:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }

#linked-source .ls-node { cursor: pointer; outline: none; }
#linked-source .ls-node.node { padding: 0 10px; gap: 10px; border-radius: var(--r-md); }
#linked-source .ls-node .type-tile { width: 32px !important; height: 32px !important; }
#linked-source .ls-node .node-label { line-height: 1.25; }
#linked-source .ls-node .node-type { line-height: 1.3; }
#linked-source .ls-node.node.is-hl, #linked-source .ls-node.node.is-sel { box-shadow: 0 0 0 2px var(--ground), 0 0 0 4px var(--accent); }
#linked-source .ls-node.node:focus-visible { box-shadow: 0 0 0 2px var(--ground), 0 0 0 4px var(--accent); }
#linked-source .ls-shape:focus-visible { box-shadow: none; }

/* Shaped components (browser, cylinder), as apps/web/lib/shapes.ts draws them. */
#linked-source .ls-shape { --type: var(--type-light); --stroke: color-mix(in srgb, var(--type) 45%, var(--line-2)); }
:root[data-theme="dark"] #linked-source .ls-shape { --type: var(--type-dark); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #linked-source .ls-shape { --type: var(--type-dark); } }
#linked-source .ls-shape:hover { --stroke: color-mix(in srgb, var(--edge-strong) 40%, var(--line-2)); }
#linked-source .ls-shape.is-hl, #linked-source .ls-shape.is-sel { --stroke: var(--accent); }
#linked-source .ls-shape > svg { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
#linked-source .ls-shape .part { fill: color-mix(in srgb, var(--type) 5%, var(--surface)); stroke: var(--stroke); stroke-width: 1; transition: stroke 120ms ease; }
#linked-source .ls-shape.is-hl .part, #linked-source .ls-shape.is-sel .part { stroke-width: 2; }
#linked-source .ls-shape .detail { fill: none; stroke: var(--stroke); stroke-width: 1; }
#linked-source .ls-shape .dot { fill: var(--stroke); }
#linked-source .ls-shape .content { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
#linked-source .ls-shape .glyph { display: flex; color: var(--type); margin-bottom: 4px; }
#linked-source .ls-shape .node-label, #linked-source .ls-shape .node-type { max-width: 100%; line-height: 1.3; }

#linked-source .ls-edges { left: 0; top: 0; overflow: visible; pointer-events: none; }
#linked-source .ls-edge path { fill: none; stroke: var(--edge); stroke-width: 1.5; transition: stroke 120ms ease; }
#linked-source .ls-edge polygon { fill: var(--edge); transition: fill 120ms ease; }
#linked-source .ls-edge .hit { stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; }
#linked-source .ls-edge.is-hl path:not(.hit) { stroke: var(--edge-strong); stroke-width: 2; }
#linked-source .ls-edge.is-hl polygon { fill: var(--edge-strong); }
#linked-source .ls-stage .edge-label { transform: translate(-50%, -50%); opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 120ms ease, visibility 120ms; z-index: 2; }
#linked-source .ls-stage .edge-label.is-hl { opacity: 1; visibility: visible; }

/* Source pane (SourcePane). */
#linked-source .ls-source { max-height: 220px; overflow: auto; background: var(--code-bg); border-top: 1px solid var(--line); }
@media (min-width: 1024px) { #linked-source .ls-source { max-height: 528px; border-top: 0; border-left: 1px solid var(--line); } }
#linked-source .ls-pre { margin: 0; padding: 12px 0; font-family: var(--font-mono); font-size: var(--t-sm); line-height: 20px; color: var(--code-fg); outline: none; }
#linked-source .ls-pre:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); border-radius: 0; }
#linked-source .ls-line { display: block; padding: 0 16px; min-height: 20px; border-left: 2px solid transparent; white-space: pre; transition: background-color 120ms ease, border-color 120ms ease; outline: none; }
#linked-source .ls-line[data-t] { cursor: default; }
#linked-source .ls-line.is-hl { background: var(--accent-soft); border-left-color: var(--accent); }
#linked-source .ls-line.is-sel { border-left-color: var(--accent); }
#linked-source .ls-line:focus-visible { box-shadow: inset 0 0 0 1px var(--accent); border-radius: 0; }
@keyframes ls-flash { from { background: var(--accent-soft); border-left-color: var(--accent); } }
@keyframes ls-flash-strong { from { background: color-mix(in srgb, var(--accent-soft) 100%, var(--accent) 22%); border-left-color: var(--accent); } }
@media (prefers-reduced-motion: no-preference) {
  #linked-source .ls-line.is-changed { animation: ls-flash 1400ms ease-out; }
  #linked-source .ls-line.is-changed.is-hl, #linked-source .ls-line.is-changed.is-sel { animation-name: ls-flash-strong; }
}
</style>

<script>
var root = document.getElementById("linked-source");
var A = window.Archer, C = A.catalog, CELL = 40;
root.querySelectorAll("[data-icon]").forEach(function (el) { el.innerHTML = A.icon(el.getAttribute("data-icon")); });

/* The sandbox's document (lib/landingSample.ts), in canonical form: what format() prints. */
var BODY = [
  'arch "Acme" v0.2', "",
  'component web "Web app" @vercel.nextjs {', "  shape browser", "}", "",
  'component auth "Auth" @clerk', "",
  'plane backend "Backend" {', '  component api "API" @vercel.functions', '  component db "Postgres" @supabase.postgres {', "    shape cylinder", "  }", "}", "",
  'component billing "Billing" @stripe', "",
  'api -> billing @http : "checkout"', "api -> db @sql", "web -> api @http", 'web -> auth @http : "sign in"', "",
  "layout {"
];
/* Which line draws what. */
var BODY_T = [null, null, "n:web", "n:web", "n:web", null, "n:auth", null, "p:backend", "n:api", "n:db", "n:db", "n:db", "p:backend", null, "n:billing", null, "e:0", "e:1", "e:2", "e:3", null, null];

var ITEMS = {
  web: { label: "Web app", tag: "vercel.nextjs", shape: "browser" },
  auth: { label: "Auth", tag: "clerk" },
  api: { label: "API", tag: "vercel.functions", plane: "backend" },
  db: { label: "Postgres", tag: "supabase.postgres", shape: "cylinder", plane: "backend" },
  billing: { label: "Billing", tag: "stripe" },
  backend: { label: "Backend", isPlane: true }
};
var EDGES = [["api", "billing", "checkout"], ["api", "db"], ["web", "api"], ["web", "auth", "sign in"]];

/* Wide and narrow layouts, as the real sandbox picks by viewport. Stage = the drawable area in cells. */
var narrow = window.matchMedia("(max-width: 639px)").matches;
var INITIAL = narrow
  ? { web: [1, 0, 4, 3], auth: [8, 0, 4, 3], backend: [0, 5, 6, 11], api: [1, 2, 4, 3], db: [1, 7, 4, 3], billing: [8, 7, 4, 3] }
  : { web: [0, 3, 4, 3], auth: [0, 9, 4, 3], backend: [6, 1, 12, 6], api: [1, 2, 4, 3], db: [7, 2, 4, 3], billing: [7, 9, 4, 3] };
var STAGE = narrow ? { x: -1, y: -1, w: 14, h: 18 } : { x: -1, y: 0, w: 20, h: 13 };
var layout = {};
function resetLayout() { Object.keys(INITIAL).forEach(function (k) { layout[k] = INITIAL[k].slice(); }); }
resetLayout();
var IDS = Object.keys(INITIAL).sort();

function layoutLine(id) { var l = layout[id]; return "  " + id + ": { at: [" + l[0] + ", " + l[1] + "], size: [" + l[2] + ", " + l[3] + "] }"; }
function lines() {
  var out = BODY.map(function (t, i) { return { text: t, t: BODY_T[i] }; });
  IDS.forEach(function (id) { out.push({ text: layoutLine(id), t: (ITEMS[id].isPlane ? "p:" : "n:") + id, layout: id }); });
  out.push({ text: "}", t: null });
  return out;
}
/* Box in stage pixels; components on a plane are placed relative to it. */
function box(id) {
  var l = layout[id], it = ITEMS[id], ox = 0, oy = 0;
  if (it.plane) { ox = layout[it.plane][0]; oy = layout[it.plane][1]; }
  return { x: (l[0] + ox - STAGE.x) * CELL, y: (l[1] + oy - STAGE.y) * CELL, w: l[2] * CELL, h: l[3] * CELL };
}

var clamp = function (v, lo, hi) { return Math.max(lo, Math.min(hi, v)); };
var r2 = function (v) { return Math.round(v * 100) / 100; };
var pt = function (x, y) { return r2(x) + "," + r2(y); };

function shapeGeo(shape, w, h) {
  var x = 1, y = 1; w -= 2; h -= 2;
  if (shape === "cylinder") {
    var ry = clamp(h * 0.11, 3, 13), rx = w / 2;
    return {
      part: "M" + pt(x, y + ry) + "A" + r2(rx) + "," + r2(ry) + " 0 0 1 " + pt(x + w, y + ry) + "V" + r2(y + h - ry) + "A" + r2(rx) + "," + r2(ry) + " 0 0 1 " + pt(x, y + h - ry) + "Z",
      detail: "M" + pt(x, y + ry) + "A" + r2(rx) + "," + r2(ry) + " 0 0 0 " + pt(x + w, y + ry),
      dots: "", content: { x: x + 8, y: y + 2 * ry + 3, w: w - 16, h: h - 3 * ry - 5 }
    };
  }
  var bar = clamp(h * 0.16, 5, 18), b = clamp(bar * 0.13, 1, 2.4), dots = "";
  for (var i = 0; i < 3; i++) { var cx = x + bar * 0.55 + i * b * 3.4, cy = y + bar / 2; dots += "M" + pt(cx - b, cy) + "a" + b + "," + b + " 0 1 0 " + 2 * b + ",0a" + b + "," + b + " 0 1 0 " + -2 * b + ",0"; }
  return {
    part: "M" + pt(x + 6, y) + "H" + r2(x + w - 6) + "A6,6 0 0 1 " + pt(x + w, y + 6) + "V" + r2(y + h - 6) + "A6,6 0 0 1 " + pt(x + w - 6, y + h) + "H" + r2(x + 6) + "A6,6 0 0 1 " + pt(x, y + h - 6) + "V" + r2(y + 6) + "A6,6 0 0 1 " + pt(x + 6, y) + "Z",
    detail: "M" + pt(x, y + bar) + "H" + r2(x + w), dots: dots, content: { x: x + 8, y: y + bar + 3, w: w - 16, h: h - bar - 6 }
  };
}

/* Side to side, straight when the boxes face each other, else with one bend; arrowhead at the target. */
function route(a, b) {
  var L = 11, W = 5.5, G = 5, dx = 0, dy = 0, d, tip, mid;
  var gx = Math.max(b.x - (a.x + a.w), a.x - (b.x + b.w)), gy = Math.max(b.y - (a.y + a.h), a.y - (b.y + b.h));
  var acx = a.x + a.w / 2, acy = a.y + a.h / 2, bcx = b.x + b.w / 2, bcy = b.y + b.h / 2;
  if (gx >= gy) {
    dx = bcx > acx ? 1 : -1;
    var x1 = (dx > 0 ? a.x + a.w : a.x) + dx * G, x2 = (dx > 0 ? b.x : b.x + b.w) - dx * G, y1 = acy, y2 = bcy;
    var top = Math.max(a.y, b.y), bot = Math.min(a.y + a.h, b.y + b.h);
    if (bot - top > 30) y1 = y2 = Math.round((top + bot) / 2);
    tip = [x2, y2]; var ex = x2 - dx * L, mx = Math.round((x1 + ex) / 2);
    d = y1 === y2 ? "M" + pt(x1, y1) + "H" + r2(ex) : "M" + pt(x1, y1) + "H" + mx + "V" + r2(y2) + "H" + r2(ex);
    mid = y1 === y2 ? [(x1 + x2) / 2, y1] : [mx, (y1 + y2) / 2];
  } else {
    dy = bcy > acy ? 1 : -1;
    var yy1 = (dy > 0 ? a.y + a.h : a.y) + dy * G, yy2 = (dy > 0 ? b.y : b.y + b.h) - dy * G, xx1 = acx, xx2 = bcx;
    var lf = Math.max(a.x, b.x), rt = Math.min(a.x + a.w, b.x + b.w);
    if (rt - lf > 30) xx1 = xx2 = Math.round((lf + rt) / 2);
    tip = [xx2, yy2]; var ey = yy2 - dy * L, my = Math.round((yy1 + ey) / 2);
    d = xx1 === xx2 ? "M" + pt(xx1, yy1) + "V" + r2(ey) : "M" + pt(xx1, yy1) + "V" + my + "H" + r2(xx2) + "V" + r2(ey);
    mid = xx1 === xx2 ? [xx1, (yy1 + yy2) / 2] : [(xx1 + xx2) / 2, my];
  }
  var bx = tip[0] - dx * L, by = tip[1] - dy * L;
  return { d: d, arrow: pt(tip[0], tip[1]) + " " + pt(bx - dy * W, by + dx * W) + " " + pt(bx + dy * W, by - dx * W), mid: mid };
}

/* ---- Build the canvas ---- */
var stage = root.querySelector(".ls-stage"), pre = root.querySelector(".ls-pre"), source = root.querySelector(".ls-source");
var canvas = root.querySelector(".ls-canvas"), hint = root.querySelector(".ls-hint"), resetBtn = root.querySelector(".ls-reset");
stage.style.width = STAGE.w * CELL + "px"; stage.style.height = STAGE.h * CELL + "px";
var PLANE_ICON = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="1.5" y="1.5" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>';
var els = {};

var plane = document.createElement("div");
plane.className = "plane"; plane.dataset.t = "p:backend";
plane.innerHTML = '<div class="plane-head" tabindex="0" role="button" aria-label="Backend plane. Arrow keys move it.">' + PLANE_ICON + "Backend</div>";
stage.appendChild(plane); els.backend = plane;

var svgNS = "http://www.w3.org/2000/svg";
var svg = document.createElementNS(svgNS, "svg");
svg.setAttribute("class", "ls-edges"); svg.setAttribute("width", STAGE.w * CELL); svg.setAttribute("height", STAGE.h * CELL); svg.setAttribute("aria-hidden", "true");
stage.appendChild(svg);
var edgeEls = EDGES.map(function (e, i) {
  var g = document.createElementNS(svgNS, "g");
  g.setAttribute("class", "ls-edge"); g.dataset.t = "e:" + i;
  g.innerHTML = '<path class="hit"/><path class="line"/><polygon/>';
  svg.appendChild(g);
  var label = null;
  if (e[2]) { label = document.createElement("span"); label.className = "edge-label"; label.textContent = e[2]; stage.appendChild(label); }
  return { g: g, label: label };
});

["web", "auth", "api", "db", "billing"].forEach(function (id) {
  var it = ITEMS[id], t = C.types[it.tag], el = document.createElement("div");
  el.dataset.t = "n:" + id; el.tabIndex = 0; el.setAttribute("role", "button");
  el.setAttribute("aria-label", it.label + ", " + it.tag + ". Arrow keys move it.");
  if (it.shape) {
    el.className = "ls-node ls-shape";
    el.style.cssText = "--type-light:" + t.color + ";--type-dark:" + t.dark;
  } else {
    el.className = "ls-node node";
    el.innerHTML = A.typeTile(it.tag, "md").replace(/<svg width="17" height="17"/, '<svg width="18" height="18"') +
      '<div style="min-width:0"><div class="node-label">' + it.label + '</div><div class="node-type">' + it.tag + "</div></div>";
  }
  stage.appendChild(el); els[id] = el;
});

function drawShape(id) {
  var it = ITEMS[id], b = box(id), g = shapeGeo(it.shape, b.w, b.h), c = g.content, el = els[id];
  if (el.dataset.size === b.w + "x" + b.h) return;
  el.dataset.size = b.w + "x" + b.h;
  el.innerHTML = '<svg width="' + b.w + '" height="' + b.h + '" aria-hidden="true"><path class="part" d="' + g.part + '"/><path class="detail" d="' + g.detail + '"/>' + (g.dots ? '<path class="dot" d="' + g.dots + '"/>' : "") + "</svg>" +
    '<div class="content" style="left:' + c.x + "px;top:" + c.y + "px;width:" + c.w + "px;height:" + c.h + 'px"><span class="glyph">' + A.glyph(C.types[it.tag].glyph, 18) + '</span><div class="node-label">' + it.label + '</div><div class="node-type">' + it.tag + "</div></div>";
}

function place() {
  Object.keys(els).forEach(function (id) {
    var b = box(id), s = els[id].style;
    s.left = b.x + "px"; s.top = b.y + "px"; s.width = b.w + "px"; s.height = b.h + "px";
    if (ITEMS[id].shape) drawShape(id);
  });
  EDGES.forEach(function (e, i) {
    var r = route(box(e[0]), box(e[1])), el = edgeEls[i], paths = el.g.querySelectorAll("path");
    paths[0].setAttribute("d", r.d); paths[1].setAttribute("d", r.d);
    el.g.querySelector("polygon").setAttribute("points", r.arrow);
    if (el.label) { el.label.style.left = r.mid[0] + "px"; el.label.style.top = r.mid[1] + "px"; }
  });
}

/* ---- Build the source ---- */
var lineEls = [];
function renderSource() {
  pre.innerHTML = "";
  lineEls = lines().map(function (l, i) {
    var s = document.createElement("span");
    s.className = "ls-line"; s.dataset.i = i; s.innerHTML = A.highlight(l.text) || "";
    if (l.t) { s.dataset.t = l.t; s.tabIndex = -1; }
    if (l.layout) s.dataset.layout = l.layout;
    pre.appendChild(s);
    return s;
  });
}

/* ---- Fit the stage to the canvas, as fitView does ---- */
function fit() {
  var k = Math.min(canvas.clientWidth / (STAGE.w * CELL), canvas.clientHeight / (STAGE.h * CELL));
  stage.style.transform = "scale(" + k + ") translate(-50%, -50%)";
}

/* ---- Highlight: what the pointer or focus is on, else the selection ---- */
var hover = null, focusT = null, selected = null;
function related(t) {
  var k = t.slice(0, 1), id = t.slice(2), set = {};
  set[t] = true;
  if (k === "e") { var e = EDGES[+id]; set["n:" + e[0]] = set["n:" + e[1]] = true; }
  if (k === "n") EDGES.forEach(function (e, i) { if (e[0] === id || e[1] === id) set["e:" + i] = true; });
  if (k === "p") Object.keys(ITEMS).forEach(function (n) { if (ITEMS[n].plane === id) set["n:" + n] = true; });
  if (k === "n" && ITEMS[id].plane) set["p:" + ITEMS[id].plane] = true;
  return set;
}
function paint() {
  var t = hover || focusT, rel = t ? related(t) : null, sel = selected;
  stage.querySelectorAll("[data-t]").forEach(function (el) {
    var me = el.dataset.t;
    el.classList.toggle("is-hl", me === t);
    el.classList.toggle("is-sel", me === sel);
    el.classList.toggle("is-dim", !!rel && !rel[me]);
  });
  edgeEls.forEach(function (e, i) { if (e.label) e.label.classList.toggle("is-hl", t === "e:" + i || sel === "e:" + i); });
  lineEls.forEach(function (el) {
    var me = el.dataset.t;
    el.classList.toggle("is-hl", !!me && me === t);
    el.classList.toggle("is-sel", !!me && me === sel && me !== t);
  });
  if (sel) setHint("keyboard", touch ? "Selected" : "Arrow keys move it");
  else setHint("cursor", touch ? "Tap a line or a box" : "Hover a line or a box");
}
var touch = window.matchMedia("(hover: none)").matches, hintText = "";
function setHint(icon, text) { if (text === hintText) return; hintText = text; hint.innerHTML = A.icon(icon) + text; }

/* Pointer: one handler per side, through data-t. */
function over(e) { var el = e.target.closest("[data-t]"); var t = el ? el.dataset.t : null; if (t !== hover) { hover = t; paint(); } }
[canvas, pre].forEach(function (side) {
  side.addEventListener("pointerover", over);
  side.addEventListener("pointerleave", function () { if (hover) { hover = null; paint(); } });
});

/* Lines: focus highlights; arrow keys move between the lines that draw something. */
pre.addEventListener("focusin", function (e) { var t = e.target.dataset && e.target.dataset.t; focusT = t || null; paint(); });
pre.addEventListener("focusout", function () { focusT = null; paint(); });
pre.addEventListener("keydown", function (e) {
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  var mapped = lineEls.filter(function (l) { return l.dataset.t; });
  var at = mapped.indexOf(document.activeElement);
  var next = e.key === "ArrowDown" ? (at < 0 ? 0 : Math.min(mapped.length - 1, at + 1)) : (at < 0 ? mapped.length - 1 : Math.max(0, at - 1));
  e.preventDefault();
  mapped[next].focus({ preventScroll: true });
  keepVisible(mapped[next], false);
});

/* Selecting and moving: click a box or a plane's title, then arrow keys. */
function select(t) { selected = t; paint(); }
canvas.addEventListener("click", function (e) {
  var el = e.target.closest(".ls-node, .plane-head");
  if (el) { var t = el.closest("[data-t]").dataset.t; select(t); el.focus({ preventScroll: true }); return; }
  var edge = e.target.closest(".ls-edge");
  select(edge ? edge.dataset.t : null);
});
canvas.addEventListener("focusin", function (e) {
  var el = e.target.closest(".ls-node, .plane-head");
  if (el) select(el.closest("[data-t]").dataset.t);
});
canvas.addEventListener("keydown", function (e) {
  if (e.key === "Escape") { select(null); e.target.blur(); return; }
  var step = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (!step || !selected || selected[0] === "e") return;
  e.preventDefault();
  move(selected.slice(2), step[0], step[1]);
});

function move(id, dx, dy) {
  var l = layout[id], it = ITEMS[id], x = l[0] + dx, y = l[1] + dy;
  if (it.plane) { var p = layout[it.plane]; x = clamp(x, 0, p[2] - l[2]); y = clamp(y, 1, p[3] - l[3]); }
  else { x = clamp(x, STAGE.x, STAGE.x + STAGE.w - l[2]); y = clamp(y, STAGE.y, STAGE.y + STAGE.h - l[3]); }
  if (it.isPlane) {
    // Keep the plane's parts inside it and the whole plane on the canvas.
    x = clamp(x, STAGE.x, STAGE.x + STAGE.w - l[2]); y = clamp(y, STAGE.y, STAGE.y + STAGE.h - l[3]);
  }
  if (x === l[0] && y === l[1]) return;
  l[0] = x; l[1] = y;
  place();
  var line = pre.querySelector('[data-layout="' + id + '"]');
  line.innerHTML = A.highlight(layoutLine(id));
  line.classList.remove("is-changed"); void line.offsetWidth; line.classList.add("is-changed");
  keepVisible(line, true);
  resetBtn.disabled = IDS.every(function (k) { return layout[k][0] === INITIAL[k][0] && layout[k][1] === INITIAL[k][1]; });
}

/* Scroll inside the pane only; scrollIntoView would move the page too. */
function keepVisible(line, center) {
  var top = line.offsetTop, h = source.clientHeight, st = source.scrollTop;
  if (top >= st + 8 && top + 20 <= st + h - 8) return;
  source.scrollTo({ top: Math.max(0, center ? top - h / 2 : top - 24), behavior: A.reduced ? "auto" : "smooth" });
}

resetBtn.addEventListener("click", function () {
  resetLayout(); selected = null; place(); renderSource(); paint(); resetBtn.disabled = true; source.scrollTop = 0;
});

renderSource(); place(); fit(); paint();
if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas); else window.addEventListener("resize", fit);
</script>
